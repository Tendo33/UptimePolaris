name: Go release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: go-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Tags and the previous release commit are needed to scope the notes.
      # 生成说明需要 tag 和上一个发布提交，因此取完整历史。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backends/go/go.mod
          cache-dependency-path: backends/go/go.sum
      - name: Validate tag and product versions
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected a stable tag such as v0.1.0' >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          for file in package.json frontend/package.json; do
            actual=$(node -p "require('./$file').version")
            [[ "$actual" == "$version" ]] || { echo "$file version $actual does not match $GITHUB_REF_NAME" >&2; exit 1; }
          done
      - run: npm --prefix frontend ci
      - name: Build frontend once
        run: node scripts/build-go.mjs --assets-only
      - run: npm run test:go-release
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          version="${GITHUB_REF_NAME#v}"
          # windows/arm64 与 windows/amd64 并列；两者都以 .exe 结尾。
          # windows/arm64 sits beside windows/amd64; both carry the .exe suffix.
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=''
            [[ "$os" != windows ]] || ext='.exe'
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go -C backends/go build -tags release -trimpath -ldflags="-X github.com/XingLingQAQ/uptime/backends/go/internal/updates.Version=$version -X github.com/XingLingQAQ/uptime/backends/go/internal/updates.Repository=$GITHUB_REPOSITORY" -o "$GITHUB_WORKSPACE/release/polaris-${version}-${os}-${arch}${ext}" ./cmd/polaris
          done
          "release/polaris-${version}-linux-amd64" --update-info > release/polaris-update.json
          (cd release && sha256sum polaris-* > SHA256SUMS.txt)
      - name: Prepare container image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backends/go/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            RELEASE_REPOSITORY=${{ github.repository }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      # Commits go straight to the default branch, so GitHub's label-based
      # generator produces an empty body. Group the commit messages instead.
      # 提交直接进默认分支，GitHub 按标签生成的说明是空的，改为按提交信息分组。
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: .github/cliff.toml
          args: --latest
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Show release notes
        run: cat RELEASE_NOTES.md
      - name: Create and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md release/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
